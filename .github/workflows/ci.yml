name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile \
            majsoul_live_helper.py \
            majsoul_cdp_live.py \
            parse_majsoul_har.py \
            tools/analyze_aligned_paipu.py \
            test_majsoul_live_helper.py

      - name: Run unit tests
        run: python -m unittest test_majsoul_live_helper.py

      - name: Run regression cases
        run: python tools/run_all_regressions.py
